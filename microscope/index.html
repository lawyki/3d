<title>Diatom Microscope</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,300&display=swap">
<style>
/* Layout: a tall page whose only content is one fixed, full-bleed view of the inside of a microscope.
   Scrolling moves the camera from stop to stop along the path of the light. A caption sits bottom left,
   an index of the stops runs down the right edge. Single dark look by choice: the light is additive and
   only exists against black. */
:root {
  --bg: #030407;
  --fg: #d5dceb;
  --muted: #7a849b;
  --line: rgba(213, 220, 235, 0.2);
  --line-strong: rgba(213, 220, 235, 0.6);
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  color-scheme: dark;
}
html { background: var(--bg); }
body { background: var(--bg); color: var(--fg); font-family: var(--mono); font-size: 12px; margin: 0; }
#film { position: relative; }
#stage {
  position: sticky; top: 0;
  height: 100vh; height: 100dvh;
  overflow: hidden;
  background: var(--bg);
}
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.caption {
  position: absolute;
  left: max(16px, env(safe-area-inset-left, 0px), 3.2vw);
  bottom: max(44px, 8vh);
  width: min(430px, calc(100% - 96px));
  pointer-events: none;
  text-shadow: 0 0 12px var(--bg), 0 0 3px var(--bg);
}
.caption .num { color: var(--muted); letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
.caption h2 { font-family: var(--serif); font-weight: 300; font-size: clamp(30px, 4.2vw, 50px); line-height: 1.05; margin: 8px 0 12px; letter-spacing: -0.01em; text-wrap: balance; }
.caption p { margin: 0; color: var(--fg); opacity: 0.82; line-height: 1.6; font-size: 12.5px; max-width: 46ch; text-wrap: pretty; }
.index {
  position: absolute;
  right: max(10px, env(safe-area-inset-right, 0px), 1.6vw);
  top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: flex-end;
}
.index button {
  font: inherit; font-size: 11px; color: var(--muted); background: none; border: 0; cursor: pointer;
  padding: 5px 4px; display: flex; align-items: center; gap: 9px; letter-spacing: 0.02em;
}
.index button span { opacity: 0; transition: opacity .2s; white-space: nowrap; }
.index:hover button span, .index button:focus-visible span, .index button[aria-current="true"] span { opacity: 1; }
.index button i { display: block; width: 14px; height: 1px; background: var(--line-strong); opacity: 0.55; transition: width .25s, opacity .25s; }
.index button[aria-current="true"] { color: var(--fg); }
.index button[aria-current="true"] i { width: 26px; opacity: 1; }
.index button:hover { color: var(--fg); }
.index button:focus-visible { outline: 1px solid var(--line-strong); outline-offset: 1px; }
.cue {
  position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
  color: var(--muted); letter-spacing: 0.14em; font-size: 10.5px; text-transform: uppercase;
  transition: opacity .5s; pointer-events: none;
}
.count { position: absolute; right: max(16px, env(safe-area-inset-right, 0px), 1.6vw); bottom: 20px; color: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; pointer-events: none; }
#fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
@media (max-width: 640px) {
  .index button span { display: none; }
  .caption { width: calc(100% - 72px); bottom: 44px; }
  .cue { left: auto; right: 16px; transform: none; bottom: 16px; }
  .count { display: none; }
}
</style>

<div id="film">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="fail" hidden>This page needs WebGL 2 to draw the light. Open it in a current browser.</div>
    <div class="caption" id="caption"><span class="num" id="c-num"></span><h2 id="c-title"></h2><p id="c-line"></p></div>
    <nav class="index" id="index" aria-label="Stops along the light path"></nav>
    <div class="cue" id="cue">Scroll to go inside</div>
    <div class="count" id="count"></div>
  </div>
</div>

<script>
(() => {
'use strict';
/* ───────────── Optics: glass, solids, exact intersection, Snell ─────────────
   Every optical element is a convex solid: the overlap of spheres, half-spaces and a cylinder. A ray meets
   such a solid over one interval, found in closed form, so a photon lands exactly on the surface. */
const GLASS = {
  crown: [1.5046, 0.0042],      // close to BK7
  flint: [1.7388, 0.01597]      // close to SF11, the dense flint of the prism
};
const nGlass = (g, um) => g[0] + g[1] / (um * um);
const SPH = 0, PLN = 1, CYL = 2, CON = 3;
const ELS = [];
const hitOut = { tin: 0, pin: -1, tout: 0, pout: -1 };

function interval(el, px, py, pz, dx, dy, dz) {
  let lo = -Infinity, hi = Infinity, pl = -1, ph = -1, s1 = 1, s2 = 0, pn = -1;
  const pr = el.prims;
  for (let i = 0; i < pr.length; i++) {
    const q = pr[i];
    let t1, t2;
    if (q.t === SPH) {
      const ox = px - q.cx, oy = py - q.cy, oz = pz - q.cz;
      const b = ox * dx + oy * dy + oz * dz, c = ox * ox + oy * oy + oz * oz - q.R * q.R;
      const disc = b * b - c;
      if (q.neg) { if (disc > 0) { const s = Math.sqrt(disc); s1 = -b - s; s2 = -b + s; pn = i; } continue; }   // a hollow: the glass is outside this sphere
      if (disc <= 0) return false;
      const s = Math.sqrt(disc);
      t1 = -b - s; t2 = -b + s;
    } else if (q.t === CON) {
      // conic of revolution about the axis a, vertex c:  |o|² + k·z² − 2R·z = 0,  z measured into the glass
      const ox = px - q.cx, oy = py - q.cy, oz = pz - q.cz;
      const z0 = ox * q.ax + oy * q.ay + oz * q.az, dz0 = dx * q.ax + dy * q.ay + dz * q.az;
      const A = 1 + q.k * dz0 * dz0, B = ox * dx + oy * dy + oz * dz + q.k * z0 * dz0 - q.R * dz0;
      const C = ox * ox + oy * oy + oz * oz + q.k * z0 * z0 - 2 * q.R * z0;
      const disc = B * B - A * C;
      if (disc <= 0) return false;
      const s = Math.sqrt(disc);
      t1 = (-B - s) / A; t2 = (-B + s) / A;
    } else if (q.t === PLN) {
      const dn = dx * q.nx + dy * q.ny + dz * q.nz, dist = px * q.nx + py * q.ny + pz * q.nz - q.d;
      if (Math.abs(dn) < 1e-13) { if (dist > 0) return false; continue; }
      const t = -dist / dn;
      if (dn > 0) { t1 = -Infinity; t2 = t; } else { t1 = t; t2 = Infinity; }
    } else {
      let ox = px - q.cx, oy = py - q.cy, oz = pz - q.cz;
      const oa = ox * q.ax + oy * q.ay + oz * q.az, da = dx * q.ax + dy * q.ay + dz * q.az;
      ox -= oa * q.ax; oy -= oa * q.ay; oz -= oa * q.az;
      const ex = dx - da * q.ax, ey = dy - da * q.ay, ez = dz - da * q.az;
      const A = ex * ex + ey * ey + ez * ez, c0 = ox * ox + oy * oy + oz * oz - q.R * q.R;
      if (A < 1e-14) { if (c0 > 0) return false; continue; }
      const b = (ox * ex + oy * ey + oz * ez) / A, disc = b * b - c0 / A;
      if (disc <= 0) return false;
      const s = Math.sqrt(disc);
      t1 = -b - s; t2 = -b + s;
    }
    if (t1 > lo) { lo = t1; pl = i; }
    if (t2 < hi) { hi = t2; ph = i; }
    if (lo >= hi) return false;
  }
  if (pn >= 0) {                                  // cut the hollow (s1, s2) out of the interval
    if (s1 > 1e-9 && s1 < hi) { hitOut.tout = s1; hitOut.pout = pn; } else { hitOut.tout = hi; hitOut.pout = ph; }
    if (lo <= s1 || lo >= s2) { hitOut.tin = lo; hitOut.pin = pl; }
    else if (s2 < hi) { hitOut.tin = s2; hitOut.pin = pn; }
    else return false;
    return true;
  }
  hitOut.tin = lo; hitOut.pin = pl; hitOut.tout = hi; hitOut.pout = ph;
  return true;
}
// outward unit normal of a primitive at a point on it
const nrm = [0, 0, 0];
function normalAt(q, x, y, z) {
  if (q.t === SPH) { const s = q.neg ? -q.R : q.R; nrm[0] = (x - q.cx) / s; nrm[1] = (y - q.cy) / s; nrm[2] = (z - q.cz) / s; }
  else if (q.t === PLN) { nrm[0] = q.nx; nrm[1] = q.ny; nrm[2] = q.nz; }
  else if (q.t === CON) {
    const ox = x - q.cx, oy = y - q.cy, oz = z - q.cz, f = q.k * (ox * q.ax + oy * q.ay + oz * q.az) - q.R;
    const gx = ox + f * q.ax, gy = oy + f * q.ay, gz = oz + f * q.az, l = Math.hypot(gx, gy, gz);
    nrm[0] = gx / l; nrm[1] = gy / l; nrm[2] = gz / l;
  }
  else {
    let ox = x - q.cx, oy = y - q.cy, oz = z - q.cz;
    const oa = ox * q.ax + oy * q.ay + oz * q.az;
    ox -= oa * q.ax; oy -= oa * q.ay; oz -= oa * q.az;
    const l = Math.hypot(ox, oy, oz);
    nrm[0] = ox / l; nrm[1] = oy / l; nrm[2] = oz / l;
  }
}
// distance of a point from the surface of a primitive (for the checks)
function surfDist(q, x, y, z) {
  if (q.t === SPH) { const d = Math.hypot(x - q.cx, y - q.cy, z - q.cz) - q.R; return q.neg ? -d : d; }
  if (q.t === PLN) return x * q.nx + y * q.ny + z * q.nz - q.d;
  if (q.t === CON) {
    const ox = x - q.cx, oy = y - q.cy, oz = z - q.cz, zz = ox * q.ax + oy * q.ay + oz * q.az, f = q.k * zz - q.R;
    return (ox * ox + oy * oy + oz * oz + q.k * zz * zz - 2 * q.R * zz) / (2 * Math.hypot(ox + f * q.ax, oy + f * q.ay, oz + f * q.az));
  }
  let ox = x - q.cx, oy = y - q.cy, oz = z - q.cz;
  const oa = ox * q.ax + oy * q.ay + oz * q.az;
  return Math.hypot(ox - oa * q.ax, oy - oa * q.ay, oz - oa * q.az) - q.R;
}
function insideEl(el, x, y, z) { let m = -Infinity; for (const q of el.prims) { const d = surfDist(q, x, y, z); if (d > m) m = d; } return m; }

/* Snell's law in vector form. d is the unit direction, N the outward normal of the glass, n1 → n2.
   Returns 0 for refraction, 1 for total internal reflection; the new direction is left in dirOut. */
const dirOut = [0, 0, 0];
function bend(dx, dy, dz, Nx, Ny, Nz, n1, n2) {
  let c = -(dx * Nx + dy * Ny + dz * Nz);
  if (c < 0) { c = -c; Nx = -Nx; Ny = -Ny; Nz = -Nz; }       // normal turned against the incoming ray
  const eta = n1 / n2, k = 1 - eta * eta * (1 - c * c);
  if (k < 0) {
    dirOut[0] = dx + 2 * c * Nx; dirOut[1] = dy + 2 * c * Ny; dirOut[2] = dz + 2 * c * Nz;
    return 1;
  }
  const f = eta * c - Math.sqrt(k);
  let tx = eta * dx + f * Nx, ty = eta * dy + f * Ny, tz = eta * dz + f * Nz;
  const l = Math.hypot(tx, ty, tz);
  dirOut[0] = tx / l; dirOut[1] = ty / l; dirOut[2] = tz / l;
  return 0;
}

/* A lens on an axis: vertex of the first surface at v, axis u (unit). R1, R2 > 0 are convex radii, < 0
   hollow, 0 flat. a is the half aperture, te the thickness at the rim. */
function sag(R, a, k) { return R === 0 ? 0 : Math.sign(R) * a * a / (Math.abs(R) * (1 + Math.sqrt(1 - (1 + (k || 0)) * a * a / (R * R)))); }
function makeLens(name, glass, v, u, R1, R2, a, te, k2) {
  const tc = te + sag(R1, a) + sag(R2, a, k2);
  const w = [v[0] + u[0] * tc, v[1] + u[1] * tc, v[2] + u[2] * tc];
  const prims = [];
  if (R1 !== 0) prims.push({ t: SPH, cx: v[0] + u[0] * R1, cy: v[1] + u[1] * R1, cz: v[2] + u[2] * R1, R: Math.abs(R1), neg: R1 < 0, opt: 1 });
  else prims.push({ t: PLN, nx: -u[0], ny: -u[1], nz: -u[2], d: -(u[0] * v[0] + u[1] * v[1] + u[2] * v[2]), opt: 1 });
  if (R2 > 0 && k2) prims.push({ t: CON, cx: w[0], cy: w[1], cz: w[2], ax: -u[0], ay: -u[1], az: -u[2], R: R2, k: k2, opt: 1 });
  else if (R2 !== 0) prims.push({ t: SPH, cx: w[0] - u[0] * R2, cy: w[1] - u[1] * R2, cz: w[2] - u[2] * R2, R: Math.abs(R2), neg: R2 < 0, opt: 1 });
  else prims.push({ t: PLN, nx: u[0], ny: u[1], nz: u[2], d: u[0] * w[0] + u[1] * w[1] + u[2] * w[2], opt: 1 });
  prims.push({ t: CYL, cx: v[0], cy: v[1], cz: v[2], ax: u[0], ay: u[1], az: u[2], R: a, opt: 0 });
  // a hollow face ends in a flat ring at the rim, which closes the solid
  if (R1 < 0) { const s = sag(R1, a); prims.push({ t: PLN, nx: -u[0], ny: -u[1], nz: -u[2], d: -(u[0] * v[0] + u[1] * v[1] + u[2] * v[2] + s), opt: 0 }); }
  if (R2 < 0) { const s = sag(R2, a); prims.push({ t: PLN, nx: u[0], ny: u[1], nz: u[2], d: u[0] * w[0] + u[1] * w[1] + u[2] * w[2] - s, opt: 0 }); }
  return { kind: 'lens', name, glass, prims, v, u, w, R1, R2, a, te, tc, k2: k2 || 0 };
}
/* A right-angle prism in the x–y plane: light enters the face x = cx − L/2, reflects off the long face
   (y = x − cx) by total internal reflection and leaves upward through the face y = L/2. */
function makePrism(name, glass, cx, L) {
  const h = L / 2, s = Math.SQRT1_2;
  return {
    kind: 'prism', name, glass, cx, L, prims: [
      { t: PLN, nx: -1, ny: 0, nz: 0, d: -(cx - h), opt: 1 },
      { t: PLN, nx: 0, ny: 1, nz: 0, d: h, opt: 1 },
      { t: PLN, nx: s, ny: -s, nz: 0, d: s * cx, opt: 1 },
      { t: PLN, nx: 0, ny: 0, nz: 1, d: h, opt: 0 },
      { t: PLN, nx: 0, ny: 0, nz: -1, d: h, opt: 0 }
    ]
  };
}

/* Follow one ray through a list of elements (used to place the lenses: nothing in the layout is assumed
   from a formula, every focus is found by sending rays through the real surfaces). */
function traceThrough(els, p, d, um, maxEv) {
  let x = p[0], y = p[1], z = p[2], dx = d[0], dy = d[1], dz = d[2], cur = -1;
  for (let ev = 0; ev < (maxEv || 40); ev++) {
    let t = Infinity, e = -1, pi = -1;
    if (cur >= 0) { if (!interval(els[cur], x, y, z, dx, dy, dz)) break; t = hitOut.tout; pi = hitOut.pout; e = cur; }
    else for (let i = 0; i < els.length; i++) if (interval(els[i], x, y, z, dx, dy, dz) && hitOut.tin > 1e-9 && hitOut.tin < t) { t = hitOut.tin; pi = hitOut.pin; e = i; }
    if (e < 0) break;
    x += dx * t; y += dy * t; z += dz * t;
    const q = els[e].prims[pi];
    if (!q.opt) return null;
    normalAt(q, x, y, z);
    const ng = nGlass(els[e].glass, um);
    const tir = bend(dx, dy, dz, nrm[0], nrm[1], nrm[2], cur >= 0 ? ng : 1, cur >= 0 ? 1 : ng);
    dx = dirOut[0]; dy = dirOut[1]; dz = dirOut[2];
    if (!tir) cur = cur >= 0 ? -1 : e;
  }
  return [x, y, z, dx, dy, dz];
}
// where a ray that entered parallel to the axis, a little off it, crosses the axis again behind the lens
function backFocus(group, um, reverse) {
  if (!Array.isArray(group)) group = [group];
  const lens = { u: group[0].u, v: group[0].v, w: group[group.length - 1].w };
  const u = lens.u, sgn = reverse ? -1 : 1;
  const side = Math.abs(u[1]) > 0.9 ? [1, 0, 0] : [0, 1, 0], h = 0.004;
  const from = reverse ? lens.w : lens.v;
  const p = [from[0] - sgn * u[0] * 0.5 + side[0] * h, from[1] - sgn * u[1] * 0.5 + side[1] * h, from[2] - sgn * u[2] * 0.5 + side[2] * h];
  const r = traceThrough(group, p, [sgn * u[0], sgn * u[1], sgn * u[2]], um);
  const out = reverse ? lens.v : lens.w;
  const hh = (r[0] - out[0]) * side[0] + (r[1] - out[1]) * side[1] + (r[2] - out[2]) * side[2];
  const slope = (r[3] * side[0] + r[4] * side[1] + r[5] * side[2]) / (sgn * (r[3] * u[0] + r[4] * u[1] + r[5] * u[2]));
  const along = sgn * ((r[0] - out[0]) * u[0] + (r[1] - out[1]) * u[1] + (r[2] - out[2]) * u[2]);
  return along - hh / slope;          // distance from the last vertex to the focus
}

/* ───────────── The instrument ─────────────
   Lamp at the origin, light travelling along +x. Collector makes it parallel, condenser brings it to a
   focus on the specimen, objective makes each point of the specimen a parallel bundle, the prism turns
   everything upward, the tube lens brings each bundle back to a point: the picture. */
const UM0 = 0.55;
const SC = {};
function buildScene(o) {
  ELS.length = 0;
  const X = [1, 0, 0], Y = [0, 1, 0];
  const place = (name, glass, R1, R2, a, te, focusAt, gapBefore) => {
    // put the lens so that its front focus sits at x = focusAt (lens on the +x axis)
    const probe = makeLens(name, glass, [0, 0, 0], X, R1, R2, a, te);
    const ffd = backFocus(probe, UM0, true);
    const vx = gapBefore !== undefined ? gapBefore : focusAt + ffd;
    const L = makeLens(name, glass, [vx, 0, 0], X, R1, R2, a, te);
    L.ffd = ffd; L.bfd = backFocus(L, UM0, false);
    return L;
  };
  const coll = place('collector', GLASS.crown, o.collR, o.collR, o.collA, 0.035, 0);
  const cond = place('condenser', GLASS.flint, o.condR, o.condR, o.condA, 0.035, 0, coll.w[0] + o.gap1);
  const xs = cond.w[0] + cond.bfd;                           // the focus: the specimen sits here
  // objective: an air-spaced achromat. Flat flint face toward the specimen, then its hollow, then a crown lens.
  const mkObj = x0 => {
    const f = makeLens('objective flint', GLASS.flint, [x0, 0, 0], X, 0, -o.objRa, o.objA, o.objTf - sag(-o.objRa, o.objA));
    const c = makeLens('objective crown', GLASS.crown, [f.w[0] + o.objGap, 0, 0], X, o.objRc, o.objRb, o.objA, 0.03, o.objK);
    return [f, c];
  };
  const objFfd = backFocus(mkObj(0), UM0, true);
  const [objF, obj] = mkObj(xs + objFfd);
  objF.ffd = objFfd;
  const px = obj.w[0] + o.gap2 + o.prismL / 2;
  const prism = makePrism('prism', GLASS.flint, px, o.prismL);
  const tubeProbe = makeLens('tube', GLASS.crown, [0, 0, 0], Y, o.tubeR, o.tubeR, o.tubeA, 0.03);
  const tube = makeLens('tube lens', GLASS.crown, [px, o.prismL / 2 + o.gap3, 0], Y, o.tubeR, o.tubeR, o.tubeA, 0.03);
  tube.bfd = backFocus(tube, UM0, false);
  const yi = tube.w[1] + tube.bfd;
  ELS.push(coll, cond, objF, obj, prism, tube);
  Object.assign(SC, { coll, cond, objF, obj, prism, tube, xs, px, yi, lampR: o.lampR, cone: o.cone, specR: o.specR, slideR: o.slideR, frame: o.frame });
  // magnification, measured: send the chief ray of an off-axis specimen point through the objective, prism and tube lens
  const r = traceThrough(ELS, [xs, 0.01, 0], [1, 0, 0], UM0);
  const t = (yi - r[1]) / r[4];
  SC.mag = (r[0] + r[3] * t - px) / 0.01;
  return SC;
}
const DESIGN = {
  lampR: 0.045, cone: 13.5 * Math.PI / 180,
  collR: 1.02, collA: 0.36,
  gap1: 0.75, condR: 2.05, condA: 0.36,
  objRa: 0.95, objRc: 1.0, objRb: 0.35, objK: -0.5, objTf: 0.035, objGap: 0.006, objA: 0.22,
  gap2: 0.62, prismL: 0.6, gap3: 0.62,
  tubeR: 2.75, tubeA: 0.36,
  specR: 0.058, slideR: 0.2, frame: 0.28
};

/* The specimen: a diatom, simplified to a stencil with three kinds of opening. Returns the share of
   light of this wavelength that gets through at (y, z) on the slide. */
function specimen(y, z, nm) {
  const R = SC.specR, r = Math.hypot(y, z) / R;
  if (r > 1) return 0;
  const phi = Math.atan2(z, y);
  if (r > 0.9) return r < 0.985 ? 1 : 0;                                   // the rim of the shell
  const NR = 12, sect = 6.283185307179586 / NR;
  let a = phi / sect; a -= Math.round(a);                                   // −0.5 … 0.5 across one sector, 0 on a rib

const LOOK = { glow: 0.5, spread: 0.72, sat: 0.5, level: 1 };
function pass(pg, dst, src, pxx, pyy) {

}

/* ───────────── Page: scroll, captions, index ───────────── */
const film = document.getElementById('film');
film.style.height = (NV * 100) + 'vh';
const cNum = document.getElementById('c-num'), cTitle = document.getElementById('c-title'), cLine = document.getElementById('c-line');
const captionEl = document.getElementById('caption'), cue = document.getElementById('cue'), countEl = document.getElementById('count');
const indexEl = document.getElementById('index'), indexBtns = [];
const scroller = () => document.scrollingElement || document.documentElement;
function goTo(i) {
  const sc = scroller(), max = sc.scrollHeight - sc.clientHeight;
  sc.scrollTo({ top: max * i / (NV - 1), behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
VIEWS.forEach((v, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.innerHTML = '<span></span><i></i>';
  b.firstChild.textContent = v.name;
  b.setAttribute('aria-label', (i + 1) + '. ' + v.title);
  b.addEventListener('click', () => goTo(i));
  indexEl.appendChild(b); indexBtns.push(b);
});
let shown = -1;
function updateCaption() {
  const i = Math.min(NV - 1, Math.max(0, Math.round(sSmooth)));
  if (i !== shown) {
    shown = i;
    cNum.textContent = String(i + 1).padStart(2, '0') + ' / ' + String(NV).padStart(2, '0');
    cTitle.textContent = VIEWS[i].title; cLine.textContent = VIEWS[i].line;
    indexBtns.forEach((b, k) => b.setAttribute('aria-current', k === i ? 'true' : 'false'));
  }
  const a = Math.max(0, 1 - Math.abs(sSmooth - i) * 3.4);

  cue.style.opacity = sSmooth < 0.12 ? '1' : '0';
}
function readScroll() {
  const sc = scroller(), max = sc.scrollHeight - sc.clientHeight;
  sRaw = max > 0 ? Math.min(1, Math.max(0, sc.scrollTop / max)) * (NV - 1) : 0;
}
addEventListener('scroll', readScroll, { passive: true });
addEventListener('keydown', e => {
  const cur = Math.round(sRaw);
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && !e.shiftKey)) { if (e.target.tagName !== 'BUTTON' || e.key !== ' ') { e.preventDefault(); goTo(Math.min(NV - 1, cur + 1)); } }
  else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'PageUp' || (e.key === ' ' && e.shiftKey)) { e.preventDefault(); goTo(Math.max(0, cur - 1)); }
});
stageEl.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  const r = stageEl.getBoundingClientRect();
  ptrX = ((e.clientX - r.left) / r.width - 0.5) * 2; ptrY = ((e.clientY - r.top) / r.height - 0.5) * 2;
});
stageEl.addEventListener('pointerleave', () => { ptrX = 0; ptrY = 0; });
function resize() {
  W = stageEl.clientWidth || 1; H = stageEl.clientHeight || 1;
  DPR = Math.min(window.devicePixelRatio || 1, 1.75);
  const w = Math.max(2, Math.round(W * DPR)), h = Math.max(2, Math.round(H * DPR));
  if (w !== cv.width || h !== cv.height) { cv.width = w; cv.height = h; buildTargets(); }
  readScroll();
}
addEventListener('resize', resize);
new ResizeObserver(resize).observe(stageEl);

/* ───────────── Loop ───────────── */
let lastT = 0, fps = 60, manual = false, slowT = 0, hudT = 0;
function tick(dt) {
  const target = sOverride !== null ? sOverride : sRaw;
  sSmooth += (target - sSmooth) * (1 - Math.exp(-dt / 0.28));
  ptrSX += (ptrX - ptrSX) * (1 - Math.exp(-dt / 0.35)); ptrSY += (ptrY - ptrSY) * (1 - Math.exp(-dt / 0.35));
  updateCaption();
  hudT += dt;

}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0.001, (now - lastT) / 1000));
  lastT = now;
  if (manual) return;
  fps += (1 / dt - fps) * 0.05;

resize();
// start with the light already all the way through, so the first frame shows the finished picture
for (let i = 0; i < 300; i++) step(1 / 30);
updateCaption();

/* Hooks for checking the physics from outside the page. */
window.__scope = {
  SC, ELS, VIEWS, LOOK,
  setManual(v) { manual = v; }, step,
  show(s) { sOverride = s; sSmooth = s; ptrSX = ptrSY = 0; updateCaption(); render(); },
  release() { sOverride = null; },
  get fps() { return fps; }, get count() { return count; }, get quality() { return quality; }, set quality(v) { quality = v; }, get hdr() { return HDR; },
  record(on) { dbg = on ? [] : null; },
  takeEvents() { const d = dbg; if (dbg) dbg = []; return d; },
  checkEvents(evs) {                       // Snell residual, distance of each bend from the true surface, bend kept in the plane of incidence
    let snell = 0, off = 0, plane = 0, norm = 0, tirBad = 0, tir = 0;
    for (const e of evs) {
      const E = ELS[e[3]], q = E.prims[e[4]];

      normalAt(q, e[0], e[1], e[2]);

})();
