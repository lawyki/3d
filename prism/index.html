<title>Flint Prism</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed optical bench. The prism sits alone in the dark; a single line of
   instrument readout and three view switches run along the bottom edge. Single dark look by choice:
   the light is additive and only exists against black. */
:root {
  --bg: #05060a;
  --bg-lift: #0e1119;
  --fg: #cdd5e4;
  --muted: #727c92;
  --line: rgba(205, 213, 228, 0.18);
  --line-strong: rgba(205, 213, 228, 0.55);
  --glass: #d6e4ff;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 12px;
  overflow: hidden;
}
#stage {
  position: relative;
  height: 100%;
  overflow: hidden;
  touch-action: none;
  cursor: crosshair;
  background: radial-gradient(120% 90% at 50% 46%, var(--bg-lift) 0%, var(--bg) 62%);
  user-select: none;
  -webkit-user-select: none;
}
#stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
.hud {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px 24px;
  align-items: flex-end;
  justify-content: space-between;
  pointer-events: none;
  line-height: 1.55;
}
.readout { min-width: 0; color: var(--muted); letter-spacing: 0.01em; }
.readout b { font-weight: 500; color: var(--fg); font-variant-numeric: tabular-nums; }
.readout .row { display: block; }
.views { display: flex; gap: 6px; pointer-events: auto; }
.views button {
  font: inherit;
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 12px;
  cursor: pointer;
  transition: color .15s, border-color .15s;
}
.views button:hover { color: var(--fg); }
.views button[aria-pressed="true"] { color: var(--fg); border-color: var(--line-strong); }
.views button:focus-visible { outline: 1px solid var(--glass); outline-offset: 2px; }
#fail {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  padding: 24px; text-align: center; color: var(--fg);
}
</style>

<div id="stage">
  <canvas id="glass"></canvas>
  <canvas id="lamp"></canvas>
  <canvas id="light"></canvas>
  <div id="fail" hidden>This page needs WebGL 2 to draw the light. Open it in a current browser.</div>
  <div class="hud">
    <div class="readout">
      <span class="row">Dense flint, 60° · n(λ) = 1.7388 + 0.01597/λ² · <b id="r-state">incidence 63.0°</b></span>
      <span class="row" id="r-hint">Move to aim the beam · click to hold it · scroll to zoom</span>
    </div>
    <div class="views" role="group" aria-label="View">
      <button type="button" id="v-whole" aria-pressed="true">Whole</button>
      <button type="button" id="v-entry" aria-pressed="false">Entry face</button>
      <button type="button" id="v-exit" aria-pressed="false">Exit face</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const stage = document.getElementById('stage');
const glassCv = document.getElementById('glass');
const lightCv = document.getElementById('light');
const gl = lightCv.getContext('webgl2', { alpha: true, premultipliedAlpha: true, antialias: false, powerPreference: 'high-performance' });
if (!gl) { document.getElementById('fail').hidden = false; return; }

/* ───────────── Geometry: one exact equilateral triangle, side 1, centroid at the origin (y down) ───────────── */
const HT = Math.sqrt(3) / 2;
const VX = [0, 0.5, -0.5], VY = [-2 * HT / 3, HT / 3, HT / 3];      // apex, base right, base left
const AX = [], AY = [], EX = [], EY = [], NX = [], NY = [];        // edge start, edge vector, outward unit normal
for (let i = 0; i < 3; i++) {
  const j = (i + 1) % 3;
  const ex = VX[j] - VX[i], ey = VY[j] - VY[i], l = Math.hypot(ex, ey);
  let nx = ey / l, ny = -ex / l;
  if (nx * VX[i] + ny * VY[i] < 0) { nx = -nx; ny = -ny; }
  AX.push(VX[i]); AY.push(VY[i]); EX.push(ex); EY.push(ey); NX.push(nx); NY.push(ny);
}
const AIM_X = -0.25 + 0.03 * 0.8660254, AIM_Y = -HT / 6 + 0.03 * 0.5;   // every beam line passes through this point, just inside the middle of the left face

/* ───────────── Glass: Cauchy's equation, dense flint (close to SF11), λ in micrometres ───────────── */
const CA = 1.7388, CB = 0.01597;
const nOf = um => CA + CB / (um * um);

/* ───────────── Spectrum ─────────────
   No screen can show a pure spectral colour, so the colour of each wavelength is a rendering choice. This
   one is set by hand: the hues of a real spectrum in their real order, each given room, joined without
   steps, then scaled so that the whole band adds up to white. Colours are kept in linear light, so they
   add the way light adds. */
const NM_LO = 400, NM_HI = 700;
const STOPS = [   // wavelength (nm), then the screen colour it is drawn in
  [380, 0.20, 0.00, 0.36], [405, 0.36, 0.00, 0.72], [428, 0.36, 0.04, 1.00], [450, 0.10, 0.16, 1.00], [470, 0.00, 0.45, 1.00],
  [490, 0.00, 0.83, 0.92], [510, 0.00, 1.00, 0.50], [538, 0.36, 1.00, 0.04], [568, 0.93, 0.95, 0.00], [588, 1.00, 0.70, 0.00],
  [608, 1.00, 0.40, 0.00], [635, 1.00, 0.10, 0.00], [670, 0.80, 0.00, 0.00], [700, 0.55, 0.00, 0.02], [740, 0.25, 0.00, 0.02]
];
const LUT0 = 360, LUTN = 381;
const LUT = new Float64Array(LUTN * 3), GAINS = [1, 1, 1];
{
  const lin = v => v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  const tmp = new Float64Array(LUTN * 3);
  for (let i = 0; i < LUTN; i++) {
    const nm = Math.min(STOPS[STOPS.length - 1][0], Math.max(STOPS[0][0], LUT0 + i));
    let k = 0;
    while (k < STOPS.length - 2 && nm > STOPS[k + 1][0]) k++;
    let t = (nm - STOPS[k][0]) / (STOPS[k + 1][0] - STOPS[k][0]);
    t = t * t * (3 - 2 * t);
    for (let c = 0; c < 3; c++) tmp[i * 3 + c] = lin(STOPS[k][c + 1]) + (lin(STOPS[k + 1][c + 1]) - lin(STOPS[k][c + 1])) * t;
  }
  const SIG = 9;                                       // glide between neighbouring wavelengths
  for (let i = 0; i < LUTN; i++) {
    let w = 0, r = 0, g = 0, b = 0;
    for (let j = Math.max(0, i - 27); j <= Math.min(LUTN - 1, i + 27); j++) {
      const k = Math.exp(-0.5 * (j - i) * (j - i) / (SIG * SIG));
      w += k; r += k * tmp[j * 3]; g += k * tmp[j * 3 + 1]; b += k * tmp[j * 3 + 2];
    }
    LUT[i * 3] = r / w; LUT[i * 3 + 1] = g / w; LUT[i * 3 + 2] = b / w;
  }
  const sum = [0, 0, 0];
  let n = 0;
  for (let nm = NM_LO; nm <= NM_HI; nm++, n++) for (let k = 0; k < 3; k++) sum[k] += LUT[(nm - LUT0) * 3 + k];
  const warm = [1, 0.985, 0.95];                      // a slightly warm white
  for (let k = 0; k < 3; k++) GAINS[k] = warm[k] * n / sum[k];
  for (let i = 0; i < LUTN; i++) for (let k = 0; k < 3; k++) LUT[i * 3 + k] *= GAINS[k];
}

/* ───────────── Photons: each one is a ray with a wavelength, traced exactly ───────────── */
const C_AIR = 2.0;              // speed in air, prism sides per second. In glass it is C_AIR / n.
const TAU = 0.05;               // longest exposure: a photon shows the path it covered in the last TAU·tm seconds
const COATING = 0.3;            // the faces carry an anti-reflection coating: partial reflections are 30% of bare glass
const CHILD_I = 0.05;            // reflected photons below this energy are thinned out and the survivors boosted to it
const MIN_I = 0.03;
const EPS = 1e-9;
const K_LAMBDA = 8;             // wavelengths per white packet
const RATE = 2700;              // packets per second at full quality
const R_CIRC = 0.5774;          // the prism fits inside this circle

const ST = 28, CAP = 190000;
// x y dx dy n I state r g b T rem bends [x y t]×4 tailMul phase hits
const P = new Float64Array(ST * CAP);
let count = 0;
let quality = matchMedia('(pointer: coarse)').matches ? 0.45 : 1;
let dbg = null;                 // set to an array to record every surface interaction (used by the checks)

let seed = 0x2545f491;
function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return ((seed >>> 0) + 0.5) / 4294967296; }
function gauss() { return Math.sqrt(-2 * Math.log(rnd())) * Math.cos(6.283185307179586 * rnd()); }

function addBend(o, x, y, t) {
  let tc = P[o + 12];
  if (tc === 4) { for (let k = 0; k < 9; k++) P[o + 13 + k] = P[o + 16 + k]; tc = 3; }
  const q = o + 13 + tc * 3;
  P[q] = x; P[q + 1] = y; P[q + 2] = t; P[o + 12] = tc + 1;
}
function spawn(x, y, dx, dy, n, I, st, r, g, b, T, rem, tm, ph, hits) {
  if (count >= CAP) return;
  const o = count * ST; count++;
  P[o] = x; P[o + 1] = y; P[o + 2] = dx; P[o + 3] = dy; P[o + 4] = n; P[o + 5] = I; P[o + 6] = st;
  P[o + 7] = r; P[o + 8] = g; P[o + 9] = b; P[o + 10] = T; P[o + 11] = rem; P[o + 12] = 0;
  P[o + 25] = tm; P[o + 26] = ph; P[o + 27] = hits;
  addBend(o, x, y, T);
}

/* Move one photon through its remaining time. It travels in a straight line to the nearest face it is
   actually heading through, stops exactly on that face, refracts or reflects there, and carries on with
   whatever time is left, so no step ever jumps across a surface. */
function advance(i) {
  const o = i * ST;
  let rem = P[o + 11];
  if (rem <= 0) return;
  let x = P[o], y = P[o + 1], dx = P[o + 2], dy = P[o + 3], I = P[o + 5], st = P[o + 6], T = P[o + 10];
  const n = P[o + 4], ph = P[o + 26];
  let hits = P[o + 27];
  for (let iter = 0; iter < 24 && rem > 0; iter++) {
    const v = st ? C_AIR / n : C_AIR;
    const maxD = v * rem;
    if (!st) {                                           // too far from the glass to reach it in this step
      const lim = R_CIRC + maxD;
      if (x * x + y * y > lim * lim) { x += dx * maxD; y += dy * maxD; T += rem; rem = 0; break; }
    }
    let bt = Infinity, bu = 0, be = -1;
    for (let e = 0; e < 3; e++) {
      const dn = dx * NX[e] + dy * NY[e];
      if (st ? dn <= 0 : dn >= 0) continue;          // outside: only faces it faces. inside: only faces it leaves by.
      const ax = AX[e] - x, ay = AY[e] - y;
      const den = dx * EY[e] - dy * EX[e];
      const t = (ax * EY[e] - ay * EX[e]) / den;
      const u = (ax * dy - ay * dx) / den;
      if (t >= -EPS && u >= -EPS && u <= 1 + EPS && t < bt) { bt = t; bu = u; be = e; }
    }
    if (be < 0 && st) { st = 0; continue; }
    if (be < 0 || bt > maxD) { x += dx * maxD; y += dy * maxD; T += rem; rem = 0; break; }
    if (bt < 0) bt = 0;
    bu = bu < 0 ? 0 : bu > 1 ? 1 : bu;
    x = AX[be] + EX[be] * bu; y = AY[be] + EY[be] * bu;   // the hit point, exactly on the face
    const used = bt / v; T += used; rem -= used;

    const n1 = st ? n : 1, n2 = st ? 1 : n;
    let Nx = NX[be], Ny = NY[be];
    if (dx * Nx + dy * Ny > 0) { Nx = -Nx; Ny = -Ny; }    // normal turned against the incoming ray
    const cosi = -(dx * Nx + dy * Ny);
    const eta = n1 / n2;
    const k = 1 - eta * eta * (1 - cosi * cosi);
    const rx = dx + 2 * cosi * Nx, ry = dy + 2 * cosi * Ny;
    const idx = dx, idy = dy, I0 = I;
    let R = 1;
    hits++;
    // one dice roll shared by the whole white packet, so thinning keeps or drops its colours together
    let dice = ph * 159.1549 + hits * 0.6180339; dice -= Math.floor(dice);
    if (k < 0) {                                          // total internal reflection
      dx = rx; dy = ry;
    } else {                                              // Snell refraction + Fresnel split
      const cost = Math.sqrt(k);
      const rs = (n1 * cosi - n2 * cost) / (n1 * cosi + n2 * cost);
      const rp = (n1 * cost - n2 * cosi) / (n1 * cost + n2 * cosi);
      R = 0.5 * (rs * rs + rp * rp) * COATING;         // Fresnel reflection, cut down by the coating
      const ci = I * R;                                   // reflected share: kept in full, or thinned with the same average energy
      if (ci >= CHILD_I) spawn(x, y, rx, ry, n, ci, st, P[o + 7], P[o + 8], P[o + 9], T, rem, P[o + 25], ph, hits);
      else if (dice * CHILD_I < ci) spawn(x, y, rx, ry, n, CHILD_I, st, P[o + 7], P[o + 8], P[o + 9], T, rem, P[o + 25], ph, hits);
      let tx = eta * dx + (eta * cosi - cost) * Nx, ty = eta * dy + (eta * cosi - cost) * Ny;
      const l = Math.hypot(tx, ty);
      dx = tx / l; dy = ty / l;
      I *= 1 - R;
      st = 1 - st;
    }
    if (dbg) dbg.push([x, y, be, idx, idy, dx, dy, n1, n2, k < 0 ? 1 : 0, R, I0, I]);
    addBend(o, x, y, T);
    if (I < MIN_I) { if (dice * MIN_I < I) I = MIN_I; else { I = 0; break; } }
  }
  P[o] = x; P[o + 1] = y; P[o + 2] = dx; P[o + 3] = dy; P[o + 5] = I; P[o + 6] = st; P[o + 10] = T; P[o + 11] = 0; P[o + 27] = hits;
}

/* ───────────── Beam ───────────── */
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const THETA_HOME = -33 * Math.PI / 180;      // direction of travel; about 63° incidence on the left face
let theta = THETA_HOME, thetaTarget = THETA_HOME, thetaPrevFrame = THETA_HOME;
let userDriving = false, locked = false, simTime = 0, emitCarry = 0;
let R_EMIT = 2.2, R_KILL = 2.4;

/* The lamp: a small slit the beam leaves from. It sits on the beam line, as far back from the prism as the
   screen allows, and always clear of the glass. */
let srcSwell = 1;
const SLIT = 0.03;             // half width of the slit
function sourceDist(dx, dy) {
  // how far back along the beam line the edge of the picture is
  const hw = W / 2 / S, hh = H / 2 / S, mg = 0.34;     // room for the barrel behind the slit
  let t = 1.12;
  if (dx > 1e-6) t = Math.min(t, (AIM_X - (HOME.x - hw + mg)) / dx); else if (dx < -1e-6) t = Math.min(t, (AIM_X - (HOME.x + hw - mg)) / dx);
  if (dy > 1e-6) t = Math.min(t, (AIM_Y - (HOME.y - hh + mg)) / dy); else if (dy < -1e-6) t = Math.min(t, (AIM_Y - (HOME.y + hh - mg - 0.14)) / dy);
  // how far back the glass reaches
  let g = 2;
  for (let e = 0; e < 3; e++) {
    const dn = -dx * NX[e] - dy * NY[e];
    if (dn <= 1e-7) continue;
    const ax = AX[e] - AIM_X, ay = AY[e] - AIM_Y, den = -dx * EY[e] + dy * EX[e];
    const tt = (ax * EY[e] - ay * EX[e]) / den;
    if (tt >= 0 && tt < g) g = tt;                    // the first face met going backwards is where the glass ends
  }
  // step further back until the whole front of the lamp is clear of the glass (matters when the beam skims a face)
  let rs = Math.max(t, g + 0.2);
  for (let guard = 0; guard < 60; guard++) {
    let clear = true;
    for (let k = -1; k <= 1 && clear; k++) {
      const qx = AIM_X - dx * rs - dy * k * 0.05, qy = AIM_Y - dy * rs + dx * k * 0.05;
      let out = -Infinity;
      for (let e = 0; e < 3; e++) { const d = (qx - AX[e]) * NX[e] + (qy - AY[e]) * NY[e]; if (d > out) out = d; }
      if (out < 0.03) clear = false;
    }
    if (clear) break;
    rs += 0.04;
  }
  return rs;
}

/* The beam is composed by hand: a tight bright core, a thin veil of stragglers around it, a great many
   faint grains that make the body of the light, and a few brilliant long-tailed ones that carry the eye. */
const LOOK = { exposure: 1.3, glow: 0.55, spread: 0.74, radius: 2.0, level: 1.0, sat: 0.5 };
function emit(dt) {
  // the source breathes: slow swells in how much light leaves it, so the stream arrives in wisps
  const swell = 1 + 0.3 * Math.sin(simTime * 5.1) + 0.22 * Math.sin(simTime * 12.7 + 1.3) + 0.14 * Math.sin(simTime * 29.3 + 4.0);
  emitCarry += RATE * quality * dt * swell;
  srcSwell = swell;
  const nNew = Math.floor(emitCarry);
  emitCarry -= nNew;
  for (let p = 0; p < nNew; p++) {
    const s = rnd();                                   // moment inside this frame
    const veil = rnd() < 0.13;
    const thB = thetaPrevFrame + (theta - thetaPrevFrame) * s;
    const th = thB + gauss() * (veil ? 0.0016 : 0.0006);
    const dx = Math.cos(th), dy = Math.sin(th);
    let off = gauss();
    if (off > 2.8) off = 2.8; else if (off < -2.8) off = -2.8;
    const sk = (rnd() * 3) | 0;                        // three fine strands that drift inside the core
    off = off * (veil ? 0.019 : 0.0058) + (veil ? 0 : 0.0042 * Math.sin(simTime * (1.9 + sk * 1.3) + sk * 2.1));
    if (off > SLIT) off = SLIT; else if (off < -SLIT) off = -SLIT;
    const bx = Math.cos(thB), by = Math.sin(thB), rs = sourceDist(bx, by);   // born at the slit
    const x = AIM_X - bx * rs - dy * off, y = AIM_Y - by * rs + dx * off;
    const u = rnd();
    const spark = Math.pow(u, 13);
    const white = (veil ? 0.085 : 0.1) * LOOK.level * (1 + 11 * spark) / quality;   // most are faint, a few are brilliant
    const tm = 0.42 + 0.84 * Math.pow(u, 5) + (veil ? 0.2 : 0);
    const ph = rnd() * 6.2832;
    // an even comb of wavelengths across the band, slid by one random amount per packet: together the comb is
    // white, and over many packets every wavelength is used, so the spectrum has no steps in it
    const slide = rnd(), wk = white / K_LAMBDA;
    for (let kk = 0; kk < K_LAMBDA; kk++) {
      const nm = NM_LO + (NM_HI - NM_LO) * (kk + slide) / K_LAMBDA;
      const f = nm - LUT0, i0 = f | 0, t = f - i0, q = i0 * 3;
      spawn(x, y, dx, dy, nOf(nm / 1000), 1, 0,
        (LUT[q] + (LUT[q + 3] - LUT[q]) * t) * wk, (LUT[q + 1] + (LUT[q + 4] - LUT[q + 1]) * t) * wk, (LUT[q + 2] + (LUT[q + 5] - LUT[q + 2]) * t) * wk,
        0, (1 - s) * dt, tm, ph, 0);
    }
  }
}

function step(dt) {
  simTime += dt;
  thetaPrevFrame = theta;
  if (!userDriving && !reduceMotion) thetaTarget = THETA_HOME + (2.5 + 8.5 * Math.sin(simTime * 0.33)) * Math.PI / 180;
  let d = thetaTarget - theta;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  theta += d * (1 - Math.exp(-dt / 0.09));
  for (let i = 0; i < count; i++) P[i * ST + 11] = dt;
  emit(dt);
  for (let i = 0; i < count; i++) advance(i);          // count grows while reflected photons are born
  const kill2 = R_KILL * R_KILL;
  for (let i = count - 1; i >= 0; i--) {
    const o = i * ST;
    if (P[o + 5] <= 0 || P[o] * P[o] + P[o + 1] * P[o + 1] > kill2) {
      count--;
      if (i !== count) P.copyWithin(o, count * ST, count * ST + ST);
    }
  }
}

/* The central 550 nm ray, traced with the same rules: gives the readout and the two close-up targets. */
function centralRay(th) {
  const n = nOf(0.55);
  let dx = Math.cos(th), dy = Math.sin(th), x = AIM_X - dx * 3, y = AIM_Y - dy * 3, st = 0;
  const out = { entry: null, exit: null, incidence: 0, tir: 0, exitEdge: -1 };
  for (let iter = 0; iter < 16; iter++) {
    let bt = Infinity, be = -1;
    for (let e = 0; e < 3; e++) {
      const dn = dx * NX[e] + dy * NY[e];
      if (st ? dn <= 0 : dn >= 0) continue;
      const ax = AX[e] - x, ay = AY[e] - y, den = dx * EY[e] - dy * EX[e];
      const t = (ax * EY[e] - ay * EX[e]) / den, u = (ax * dy - ay * dx) / den;
      if (t >= -EPS && u >= -EPS && u <= 1 + EPS && t < bt) { bt = t; be = e; }
    }
    if (be < 0) break;
    x += dx * bt; y += dy * bt;
    const n1 = st ? n : 1, n2 = st ? 1 : n;
    let Nx = NX[be], Ny = NY[be];
    if (dx * Nx + dy * Ny > 0) { Nx = -Nx; Ny = -Ny; }
    const cosi = -(dx * Nx + dy * Ny), eta = n1 / n2, k = 1 - eta * eta * (1 - cosi * cosi);
    if (!out.entry) { out.entry = [x, y]; out.incidence = Math.acos(Math.min(1, cosi)) * 180 / Math.PI; }
    if (k < 0) { dx += 2 * cosi * Nx; dy += 2 * cosi * Ny; out.tir++; continue; }
    const cost = Math.sqrt(k);
    dx = eta * dx + (eta * cosi - cost) * Nx; dy = eta * dy + (eta * cosi - cost) * Ny;
    const l = Math.hypot(dx, dy); dx /= l; dy /= l;
    if (st) { out.exit = [x, y]; out.exitEdge = be; break; }
    st = 1;
  }
  return out;
}

/* ───────────── View ───────────── */
let W = 1, H = 1, DPR = 1, S = 300;                    // S: prism side in CSS pixels at zoom 1

function resize() {

  HOME.x = W > H ? 0.24 : 0; HOME.y = W > H ? 0.1 : 0;   // on a wide screen the prism sits left of centre, leaving room for the spectrum

const sx = x => W / 2 + (x - cam.x) * S * cam.z;

/* ───────────── Glass (drawn once per view change, under the light) ───────────── */
const g2 = glassCv.getContext('2d');

  g2.beginPath();

  g2.closePath();
}

  g2.setTransform(DPR, 0, 0, DPR, 0, 0);

  const gr = g2.createLinearGradient(sx(0), sy(VY[0]), sx(0), sy(VY[1]));
  gr.addColorStop(0, 'rgba(208,224,255,0.085)');

  triPath(); g2.strokeStyle = 'rgba(236,243,255,0.92)'; g2.lineWidth = 1.2; g2.stroke();

/* ───────────── The lamp: a small collimator barrel, drawn in the same line as the prism. The beam leaves

  body.lineTo(xb, h - rr); body.quadraticCurveTo(xb, h, xb + rr, h); body.lineTo(0, h); body.closePath();

/* ───────────── Light (WebGL): photons into an HDR buffer, bloom, film response, added over the glass ───────────── */
const VS = `#version 300 es
layout(location=0) in vec2 corner;
layout(location=1) in vec4 seg;      // p0.xy p1.xy
layout(location=2) in vec2 fade;     // age at p0, age at p1 (0 tail, 1 head)
layout(location=3) in vec4 col;      // rgb, size
uniform vec4 view;                   // cam.x cam.y scaleX scaleY (to clip space)
uniform float rad;
out vec2 loc; out float len; out vec2 vf; out vec3 vc; out float vr;
void main(){
  vec2 d = seg.zw - seg.xy;
  len = length(d);
  vec2 t = len > 1e-9 ? d / len : vec2(1.0, 0.0);
  vec2 nrm = vec2(-t.y, t.x);
  float r = rad * col.w;
  float a = corner.x * 0.5 + 0.5;
  vec2 p = mix(seg.xy, seg.zw, a) + t * corner.x * r + nrm * corner.y * r;
  loc = vec2(a * len + corner.x * r, corner.y * r);
  vf = fade; vc = col.rgb; vr = r;
  gl_Position = vec4((p.x - view.x) * view.z, -(p.y - view.y) * view.w, 0.0, 1.0);
}`;
const FS = `#version 300 es
precision highp float;
in vec2 loc; in float len; in vec2 vf; in vec3 vc; in float vr;
out vec4 o;
void main(){
  float u = clamp(loc.x, 0.0, len);
  float d = length(vec2(loc.x - u, loc.y)) / vr;
  if (d >= 1.0) discard;
  float f = mix(vf.x, vf.y, len > 1e-9 ? u / len : 1.0);
  float e = 1.0 - d;
  float prof = exp(-d * d * 5.0) * e * e;
  float f2 = f * f, f8 = f2 * f2 * f2 * f2;

const VS_FULL = `#version 300 es
out vec2 uv;
void main(){ vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); uv = p; gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
const FS_DOWN = `#version 300 es
precision highp float;
in vec2 uv; uniform sampler2D src; uniform vec2 px; out vec4 o;
void main(){
  vec3 c = texture(src, uv).rgb * 4.0;
  c += texture(src, uv + px * vec2(-1.0, -1.0)).rgb + texture(src, uv + px * vec2(1.0, -1.0)).rgb;
  c += texture(src, uv + px * vec2(-1.0, 1.0)).rgb + texture(src, uv + px * vec2(1.0, 1.0)).rgb;
  o = vec4(c / 8.0, 1.0);
}`;
const FS_UP = `#version 300 es
precision highp float;
in vec2 uv; uniform sampler2D src; uniform vec2 px; uniform float gain; out vec4 o;
void main(){

  c += texture(src, uv + px * vec2(0.0, -1.0)).rgb + texture(src, uv + px * vec2(0.0, 1.0)).rgb;
  c = c * 2.0 + texture(src, uv + px * vec2(-1.0, -1.0)).rgb + texture(src, uv + px * vec2(1.0, -1.0)).rgb;

const MAXSEG = Math.floor(CAP * 1.6), IS = 10;
const inst = new Float32Array(MAXSEG * IS);
const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const qb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, qb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

/* Every streak is rebuilt from the photon's real path: head, then back through its recent bends.
   A drawn segment is always a piece of the path the photon actually took. Where a photon has just
   met a face it also leaves a brief glint, placed exactly on that face. */
let segAudit = null;
const GLINT = 0.045;
function buildSegments() {

    const o = i * ST, T = P[o + 10], tm = P[o + 25], tau = TAU * tm, t0 = T - tau;
    const a = P[o + 5] * (0.8 + 0.3 * Math.sin(simTime * 23 + P[o + 26]));   // true energy, with a slow shimmer

    if (lo && r + g + b < 0.002) continue;

    const tc = P[o + 12];

        const w = 1 - (T - bt) / GLINT, k = m * IS, s = 2.6 * w * w;
        inst[k] = bx; inst[k + 1] = by; inst[k + 2] = bx; inst[k + 3] = by; inst[k + 4] = 1; inst[k + 5] = 1;
        inst[k + 6] = r * s; inst[k + 7] = g * s; inst[k + 8] = b * s; inst[k + 9] = size * 1.5;

        bt = t0; last = true;

        inst[k + 4] = (bt - t0) / tau; inst[k + 5] = (ct - t0) / tau;

/* ───────────── Pointer: the beam runs from the pointer through the prism ───────────── */

function aimFrom(e) {

  const dx = AIM_X - x, dy = AIM_Y - y;

    locked = !locked;
