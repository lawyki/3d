<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kaiku Dust</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&display=swap">
<style>
/* Kaiku with nothing but the dust. Scroll walks it through five forms; the last one is a phrase
   that keeps turning into spreading echo rings and back. Hover, drag, tap and hold all speak to it. */
:root { --bg: #f1f2ef; --fg: #101114; --accent: #2f45ff; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0b0c0f; --fg: #f0f0ec; --accent: #8c9cff; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0b0c0f; --fg: #f0f0ec; --accent: #8c9cff; color-scheme: dark; }
body { margin: 0; background: var(--bg); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
canvas#dust { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.step { height: 100vh; height: 100lvh; }
body.grab { cursor: grabbing; }
</style>

<canvas id="dust" role="img" aria-label="A cloud of dust that becomes a sphere, a ringing plate, a rippling sheet, a spiral and finally the words example text, which turn into echo rings"></canvas>
<main id="track"><div class="step"></div><div class="step"></div><div class="step"></div><div class="step"></div><div class="step"></div></main>

<script>
(function () {
  var canvas = document.getElementById('dust'), steps = document.querySelectorAll('.step'), NS = steps.length;
  var gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' });
  if (!gl) return;
  var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var N = window.innerWidth < 760 ? 56000 : 110000;
  var seed = 9; function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  var TAU = Math.PI * 2;

  /* ---------- the forms ---------- */
  function gauss() { return (rnd() + rnd() + rnd() - 1.5) * 2; }
  function dust(a, share, far) { // let some grains drift off each form, so nothing has a hard outline
    for (var i = 0; i < N; i++) { var k = rnd() < share ? far : far * 0.06; a[i * 3] += gauss() * k; a[i * 3 + 1] += gauss() * k; a[i * 3 + 2] += gauss() * k * 0.5; }
    return a; }
  function sphere() { var a = new Float32Array(N * 3);
    for (var i = 0; i < N; i++) { var y = 1 - 2 * rnd(), r = Math.sqrt(1 - y * y), t = rnd() * TAU, R = 1.1 + (rnd() - 0.5) * 0.02;
      a[i * 3] = Math.cos(t) * r * R; a[i * 3 + 1] = y * R; a[i * 3 + 2] = Math.sin(t) * r * R; }
    return a; }
  function plate(n, m) { // sand on a ringing plate: grains stay only near the lines that do not move
    var a = new Float32Array(N * 3), i = 0, tries = 0, P = Math.PI;
    while (i < N) {
      var x = rnd(), y = rnd(), f = Math.cos(n * P * x) * Math.cos(m * P * y) - Math.cos(m * P * x) * Math.cos(n * P * y); tries++;
      var edge = Math.hypot(x - 0.5, y - 0.5) * 2, keep = 1 - Math.min(1, Math.max(0, (edge - 0.5) / 0.6)); keep = keep * keep * (3 - 2 * keep);
      if (rnd() < (Math.exp(-f * f * 190) + 0.012) * keep || tries > N * 200) { a[i * 3] = (x - 0.5) * 2.5; a[i * 3 + 1] = (y - 0.5) * 2.5; a[i * 3 + 2] = (rnd() - 0.5) * 0.012; i++; }
    }
    return dust(a, 0.05, 0.12); }
  function sheet() { var a = new Float32Array(N * 3);
    for (var i = 0; i < N; i++) { a[i * 3] = gauss() * 1.05; a[i * 3 + 1] = 0; a[i * 3 + 2] = gauss() * 0.62; }
    return a; }
  var K = 0.17, TH = 2.75 * TAU, CX = 0.1, CY = -0.05;
  function cochlea(q) { var a = new Float32Array(N * 3), span = 1 - Math.exp(-K * TH);
    for (var i = 0; i < N; i++) {
      var th = -Math.log(1 - rnd() * span) / K; while (rnd() > Math.min(1, th / 1.1)) th = -Math.log(1 - rnd() * span) / K;
      var R = 1.3 * Math.exp(-K * th), tube = 0.34 * R, ph = rnd() * TAU, rr = R + tube * Math.cos(ph);
      a[i * 3] = Math.cos(th) * rr + CX; a[i * 3 + 1] = Math.sin(th) * rr + CY; a[i * 3 + 2] = tube * Math.sin(ph) + (th / TH - 0.5) * 0.7; q[i] = th / TH; }
    return dust(a, 0.08, 0.11); }
  function words(lines, done) { // grains sampled from the phrase itself
    var c = document.createElement('canvas'), x = c.getContext('2d'), W = 2000, fs = 300, lh = 1.02;
    function draw() {
      x.font = '600 ' + fs + 'px "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif';
      var wide = 0; lines.forEach(function (l) { wide = Math.max(wide, x.measureText(l).width); });
      var f = Math.min(1, W * 0.9 / wide) * fs; c.width = W; c.height = Math.ceil(f * lh * lines.length + f * 0.5);
      x.clearRect(0, 0, c.width, c.height); x.fillStyle = '#000'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.font = '600 ' + f + 'px "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif';
      lines.forEach(function (l, k) { x.fillText(l, W / 2, c.height / 2 + (k - (lines.length - 1) / 2) * f * lh + f * 0.03); });
      var d = x.getImageData(0, 0, c.width, c.height).data, pts = [];
      for (var py = 0; py < c.height; py += 2) for (var px = 0; px < W; px += 2) if (d[(py * W + px) * 4 + 3] > 128) pts.push(px, py);
      var a = new Float32Array(N * 3), n = pts.length / 2, S = lines.length > 1 ? 2.7 : 3.6;
      if (!n) return done(sphere());
      for (var i = 0; i < N; i++) { var k = Math.floor(rnd() * n) * 2;
        a[i * 3] = (pts[k] + rnd() * 2 - W / 2) / W * S; a[i * 3 + 1] = -(pts[k + 1] + rnd() * 2 - c.height / 2) / W * S; a[i * 3 + 2] = (rnd() - 0.5) * 0.05; }
      done(dust(a, 0.09, 0.13));
    }
    draw();
    if (document.fonts && document.fonts.load) document.fonts.load('600 300px "Bricolage Grotesque"').then(function () { seed = 4242; draw(); }).catch(function () {});
  }

  /* ---------- the grain shader ---------- */
  var VERT = [
    'attribute vec3 p0, p1a, p1b, p2, p3, p4; attribute vec4 rnd; attribute float q;',
    'uniform float uRingR, uP, uTime, uPx, uAspect, uScale, uHover, uMorph, uEvo, uStir, uRes, uResAmp;',
    'uniform mat3 uRot; uniform vec3 uOff, uHold; uniform vec2 uMouse, uMVel, uSrc; uniform vec4 uPulse[4];',
    'varying float vTint, vFade;',
    'float st(float k, float d){ float x = clamp((clamp(uP - k, 0.0, 1.0) - 0.04) / 0.92, 0.0, 1.0); return smoothstep(d, d + 0.55, x); }',
    'void main(){',
    '  float d = rnd.x * 0.45;',
    '  float s0 = st(0.0, d), s1 = st(1.0, d), s2 = st(2.0, d), s3 = st(3.0, d), ev = smoothstep(d, d + 0.55, uEvo);',
    // sphere: breathes in bands
    '  vec3 a = p0 * (1.0 + 0.075 * sin(p0.y * 9.0 + uTime * 1.3) * sin(atan(p0.z, p0.x) * 3.0 + uTime * 0.4));',
    // plate: hums; on a new mode every grain lifts a little and walks to its new line
    '  float m = smoothstep(d * 0.6, d * 0.6 + 0.7, uMorph);',
    '  vec3 b = mix(p1a, p1b, m) + vec3(0.0, 0.0, 0.012 * sin(uTime * 11.0 + rnd.z * 40.0) + 0.16 * sin(3.14159 * m) * (rnd.y - 0.3));',
    // sheet: two sources interfere; the second one follows the pointer
    '  float d1 = length(p2.xz - vec2(-1.1, 0.25)), d2 = length(p2.xz - uSrc);',
    '  vec3 c = p2 + vec3(0.0, 0.13 * sin(d1 * 8.5 - uTime * 2.4) / (0.7 + d1) + 0.13 * sin(d2 * 8.5 - uTime * 2.4) / (0.7 + d2), 0.0);',
    // spiral: one place along it resonates, like a pitch landing on the cochlea
    '  float band = exp(-pow((q - uRes) * 15.0, 2.0)) * uResAmp * s2 * (1.0 - s3);',
    '  vec3 e = p3 * (1.0 + 0.012 * sin(uTime * 1.6 + rnd.y * 6.283)); e.z += 0.04 * band * sin(uTime * 38.0 + rnd.z * 6.283);',
    // phrase, and the echo rings it turns into
    '  vec3 f = p4 + vec3(0.0, 0.0, 0.02 * sin(uTime * 1.3 + rnd.z * 6.283));',
    '  float ring = floor(rnd.y * 7.0), rr = fract((ring + rnd.x * 0.07 + (rnd.w - 0.5) * 0.03) / 7.0 + uTime * 0.04), ang = rnd.z * 6.2832 + ring;',
    '  float R = 0.1 + uRingR * rr; vec3 g = vec3(cos(ang) * R, sin(ang) * R * 0.36 - 0.05, sin(ang) * R * 0.93);',
    '  g.y += 0.025 * sin(R * 9.0 - uTime * 2.2);',
    '  float ringFade = smoothstep(0.0, 0.12, rr) * pow(1.0 - rr, 1.4);',
    '  vec3 p = mix(mix(mix(mix(mix(a, b, s0), c, s1), e, s2), f, s3), g, ev);',
    '  float turb = sin(3.14159 * s0) + sin(3.14159 * s1) + sin(3.14159 * s2) + sin(3.14159 * s3) + sin(3.14159 * ev) + uStir;',
    '  p += 0.4 * turb * vec3(sin(p.y * 3.1 + uTime * 0.7 + rnd.y * 6.283), sin(p.z * 2.7 + uTime * 0.9 + rnd.z * 6.283), sin(p.x * 3.3 + uTime * 0.8 + rnd.w * 6.283));',
    '  p += 0.035 * sin(vec3(p.y, p.z, p.x) * 1.7 + uTime * 0.4) + 0.012 * sin(uTime * vec3(0.9, 0.7, 1.1) + rnd.yzw * 40.0);',
    '  vec3 v = uRot * p * uScale + uOff;',
    '  float z = 5.2 - v.z;',
    '  vec2 ndc = vec2(v.x * 3.2 / uAspect, v.y * 3.2) / z;',
    // the pointer: grains lean in, ride its rings, and are dragged along by its movement
    '  vec2 dm = ndc - uMouse; dm.x *= uAspect; float l = length(dm) + 1e-4;',
    '  float near = exp(-l * l * 15.0) * uHover;',
    '  vec2 push = dm / l * (sin(l * 34.0 - uTime * 6.0) * 0.011 - 0.016) * near;',
    '  push += vec2(uMVel.x * uAspect, uMVel.y) * 0.032 * exp(-l * l * 9.0) * uHover;',
    // holding: grains gather toward the finger and shiver as the charge builds
    '  vec2 dh = ndc - uHold.xy; dh.x *= uAspect; float lh = length(dh) + 1e-4, wh = exp(-lh * lh * 5.0) * uHold.z;',
    '  push -= dh * wh * 0.42; push += dh / lh * 0.007 * sin(uTime * 47.0 + rnd.z * 40.0) * wh;',
    '  float glow = wh * 0.7;',
    // a tap or release sends a ring through the cloud, stronger after a long hold
    '  for (int k = 0; k < 4; k++) {',
    '    vec2 dp = ndc - uPulse[k].xy; dp.x *= uAspect; float lp = length(dp) + 1e-4, age = uPulse[k].z, str = uPulse[k].w;',
    '    float w = exp(-pow((lp - age * (0.9 + 0.25 * str)) * 8.0, 2.0)) * exp(-age * 1.4) * step(0.0, age);',
    '    push += dp / lp * 0.045 * str * w; glow += w * min(str, 2.0); }',
    '  push.x /= uAspect; ndc += push;',
    '  gl_Position = vec4(ndc * z, 0.0, z);',
    '  gl_PointSize = uPx * (0.65 + 0.8 * rnd.x) * 5.2 / z * (1.0 + 0.5 * min(glow, 1.5));',
    '  vTint = clamp(step(0.93, rnd.w) + near * 0.6 + glow * 1.1 + band * 0.9, 0.0, 1.0);',
    '  vFade = clamp(1.45 - 0.5 * (z - 4.2), 0.16, 1.0) * (1.0 - 0.45 * clamp(turb, 0.0, 1.0)) * mix(1.0, ringFade, ev);',
    '}'].join('\n');
  var FRAG = [
    'precision mediump float;',
    'uniform vec3 uInk, uAccent; uniform float uAlpha; varying float vTint, vFade;',
    'void main(){ float r = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.18, r);',
    '  gl_FragColor = vec4(mix(uInk, uAccent, vTint), a * uAlpha * vFade * (1.0 + 0.5 * vTint)); }'].join('\n');
  function shader(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; } return s; }
  var vs = shader(gl.VERTEX_SHADER, VERT), fs = shader(gl.FRAGMENT_SHADER, FRAG), prog = gl.createProgram();
  if (!vs || !fs) return;
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); return; }

  var bufs = {};
  function attr(name, data, size) {
    var b = bufs[name] || (bufs[name] = gl.createBuffer()), loc = gl.getAttribLocation(prog, name);
    gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    if (loc >= 0) { gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0); } }
  var r4 = new Float32Array(N * 4); for (var i = 0; i < N * 4; i++) r4[i] = rnd();
  var qa = new Float32Array(N);
  attr('rnd', r4, 4);
  attr('p0', sphere(), 3);
  var MODES = [[3, 5], [2, 7], [4, 9], [6, 7], [1, 4]], mode = 0, plateFrom = plate(3, 5), plateTo = plateFrom;
  attr('p1a', plateFrom, 3); attr('p1b', plateTo, 3);
  attr('p2', sheet(), 3);
  attr('p3', cochlea(qa), 3); attr('q', qa, 1);
  var narrowWords = window.innerWidth < 760;
  function setWords() { words(narrowWords ? ['example', 'text'] : ['example text'], function (a) { attr('p4', a, 3); }); }
  attr('p4', sphere(), 3); setWords();
  var U = {};
  ['uRingR', 'uP', 'uTime', 'uPx', 'uAspect', 'uScale', 'uHover', 'uMorph', 'uEvo', 'uStir', 'uRes', 'uResAmp', 'uRot', 'uOff', 'uHold', 'uMouse', 'uMVel', 'uSrc', 'uPulse', 'uInk', 'uAccent', 'uAlpha']
    .forEach(function (n) { U[n] = gl.getUniformLocation(prog, n); });
  gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND);

  /* ---------- a new plate mode: settle the grains where they are, then morph on the GPU ---------- */
  var morph = 1;
  function nextMode() {
    var cur = new Float32Array(N * 3);
    for (var j = 0; j < N; j++) { var d = r4[j * 4] * 0.45 * 0.6, t = Math.max(0, Math.min(1, (morph - d) / 0.7)); t = t * t * (3 - 2 * t);
      for (var c = 0; c < 3; c++) cur[j * 3 + c] = plateFrom[j * 3 + c] + (plateTo[j * 3 + c] - plateFrom[j * 3 + c]) * t; }
    mode = (mode + 1) % MODES.length; plateFrom = cur; plateTo = plate(MODES[mode][0], MODES[mode][1]);
    attr('p1a', plateFrom, 3); attr('p1b', plateTo, 3); morph = 0; }

  /* ---------- how each form is held ---------- */
  var POSE = [
    { tilt: 0.25, turn: 0.0, spin: 1, x: 0.0, y: 0.0, s: 1.0 },
    { tilt: -0.34, turn: 0.32, spin: 0, x: 0.0, y: 0.0, s: 1.02 },
    { tilt: 0.5, turn: -0.25, spin: 0, x: 0.0, y: 0.1, s: 0.82 },
    { tilt: -0.35, turn: -0.5, spin: 0.35, x: 0.05, y: 0.0, s: 1.05 },
    { tilt: 0.0, turn: 0.0, spin: 0, x: 0.0, y: 0.05, s: 1.0 }
  ];
  var NARROW = [{ s: 0.62 }, { s: 0.6 }, { s: 0.42 }, { s: 0.6 }, { s: 0.8 }];

  var ink = [0, 0, 0], accent = [0, 0, 1], bg = [1, 1, 1], dark = false;
  function rgb(v) { var c = v.trim().replace('#', ''); return [parseInt(c.substr(0, 2), 16) / 255, parseInt(c.substr(2, 2), 16) / 255, parseInt(c.substr(4, 2), 16) / 255]; }
  function theme() { var cs = getComputedStyle(document.documentElement);
    bg = rgb(cs.getPropertyValue('--bg')); ink = rgb(cs.getPropertyValue('--fg')); accent = rgb(cs.getPropertyValue('--accent')); dark = (bg[0] + bg[1] + bg[2]) / 3 < 0.4; }
  theme();
  if (window.matchMedia) { var mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', theme); }
  new MutationObserver(theme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  var dpr = 1;
  function size() { dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(canvas.clientWidth * dpr); canvas.height = Math.round(canvas.clientHeight * dpr); gl.viewport(0, 0, canvas.width, canvas.height);
    var nw = window.innerWidth < 760; if (nw !== narrowWords) { narrowWords = nw; setWords(); } }
  window.addEventListener('resize', size); size();

  /* ---------- scroll: a critically damped spring, so every move starts and lands softly ---------- */
  var target = 0, pos = 0, posVel = 0;
  function readScroll() { target = Math.max(0, Math.min(NS - 1, window.scrollY / Math.max(1, steps[0].offsetHeight))); }
  window.addEventListener('scroll', readScroll, { passive: true }); readScroll(); pos = target;

  /* ---------- pointer: hover, drag to turn, tap for a ring, hold to charge one ---------- */
  var mouse = { x: 0, y: 0, on: 0, want: 0, vx: 0, vy: 0, lt: 0 };
  var down = null, hold = { x: 0, y: 0, amt: 0 }, drag = { yaw: 0, pitch: 0, vy: 0, vp: 0 };
  var pulses = [], nextPulse = 0, pulseData = new Float32Array(16);
  for (var pi = 0; pi < 4; pi++) pulses.push({ x: 0, y: 0, t: -1, s: 1 });
  function ndcOf(e) { return [e.clientX / window.innerWidth * 2 - 1, -(e.clientY / window.innerHeight * 2 - 1)]; }
  function pulse(x, y, s) { var p = pulses[nextPulse]; p.x = x; p.y = y; p.t = performance.now(); p.s = s; nextPulse = (nextPulse + 1) % 4; }
  window.addEventListener('pointermove', function (e) {

    if (mouse.lt && mouse.want) { mouse.vx += ((n[0] - mouse.x) / dt - mouse.vx) * 0.5; mouse.vy += ((n[1] - mouse.y) / dt - mouse.vy) * 0.5; }
    mouse.x = n[0]; mouse.y = n[1]; mouse.lt = now; mouse.want = e.pointerType === 'touch' ? 0 : 1;
    if (down && down.id === e.pointerId) {

      if (!down.moved && Math.hypot(dx, dy) > 7) { down.moved = true; if (e.pointerType !== 'touch') document.body.classList.add('grab'); }
      if (down.moved && e.pointerType !== 'touch') { var ddx = (e.clientX - down.lx) / window.innerWidth, ddy = (e.clientY - down.ly) / window.innerHeight;
        drag.yaw += ddx * 3.4; drag.pitch = Math.max(-0.9, Math.min(0.9, drag.pitch + ddy * 2.4)); drag.vy = ddx * 3.4 / dt; drag.vp = ddy * 2.4 / dt; }
      down.lx = e.clientX; down.ly = e.clientY;
    }
  });
  document.addEventListener('pointerleave', function () { mouse.want = 0; });
  window.addEventListener('pointerdown', function (e) {
    if (e.button > 0) return; var n = ndcOf(e);
    down = { id: e.pointerId, cx: e.clientX, cy: e.clientY, lx: e.clientX, ly: e.clientY, t: performance.now(), moved: false, x: n[0], y: n[1] };
    hold.x = n[0]; hold.y = n[1];
  });
  function release(e, fire) {
    if (!down || down.id !== e.pointerId) return;
    if (fire && !down.moved) { pulse(down.x, down.y, 1 + 2.4 * hold.amt); if (Math.round(pos) === 1) nextMode(); }
    if (fire && down.moved) { drag.vy = Math.max(-6, Math.min(6, drag.vy)); drag.vp = Math.max(-4, Math.min(4, drag.vp)); } else { drag.vy = drag.vp = 0; }
    if (!fire) drag.vy = drag.vp = 0;
    hold.fired = fire && !down.moved; down = null; document.body.classList.remove('grab');
  }
  window.addEventListener('pointerup', function (e) { release(e, true); });
  window.addEventListener('pointercancel', function (e) { release(e, false); });

  /* ---------- turning a screen point into a point on a form's own plane ---------- */
  var rot = [1, 0, 0, 0, 1, 0, 0, 0, 1], off = [0, 0, 0], scl = 1;
  function hitPlane(nx, ny, n, h) { // camera sits at z = 5.2 looking down -z with focal 3.2
    var asp = canvas.width / canvas.height, dx = nx * asp / 3.2, dy = ny / 3.2, dz = -1;
    var m = [rot[0] * n[0] + rot[3] * n[1] + rot[6] * n[2], rot[1] * n[0] + rot[4] * n[1] + rot[7] * n[2], rot[2] * n[0] + rot[5] * n[1] + rot[8] * n[2]];
    var den = m[0] * dx + m[1] * dy + m[2] * dz; if (Math.abs(den) < 1e-4) return null;
    var t = (h * scl - (m[0] * -off[0] + m[1] * -off[1] + m[2] * (5.2 - off[2]))) / den; if (t <= 0) return null;
    var w = [(t * dx - off[0]) / scl, (t * dy - off[1]) / scl, (5.2 + t * dz - off[2]) / scl];
